name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege for the GITHUB_TOKEN; jobs that need more declare it themselves.
permissions:
  contents: read

jobs:
  secrets-scan:
    name: Secret scanning (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  lint:
    name: Lint (Laravel Pint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          # Matches the PHP floor actually required by the committed
          # composer.lock (Laravel 13.26.x's symfony/* dependencies
          # require PHP >=8.4.1). This job installs straight from the
          # lock file rather than re-resolving per matrix cell, so it
          # must run on a PHP version the lock can satisfy.
          php-version: "8.4"
          extensions: mbstring, dom, fileinfo, sqlite3, pdo_sqlite
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v6
        with:
          path: vendor
          key: composer-lint-${{ hashFiles('composer.json') }}
          restore-keys: composer-lint-

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Lint
        run: composer lint

  analyse:
    name: Static analysis (Larastan / PHPStan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          # See the matching comment in the lint job: this must satisfy
          # the committed composer.lock's actual PHP floor (>=8.4.1).
          php-version: "8.4"
          extensions: mbstring, dom, fileinfo, sqlite3, pdo_sqlite
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v6
        with:
          path: vendor
          key: composer-lint-${{ hashFiles('composer.json') }}
          restore-keys: composer-lint-

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Analyse
        run: composer analyse

  test:
    name: Tests (Pest via Testbench) — PHP ${{ matrix.php }}, Laravel ${{ matrix.laravel }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Real version-support matrix, not a single pinned combination: the
      # two most recent Laravel majors as actually published on Packagist
      # at the time this workflow was written (Laravel 12 requires PHP
      # ^8.2 and pairs with Testbench ^10.0; Laravel 13 requires PHP ^8.3
      # and pairs with Testbench ^11.0 — verified directly against
      # Packagist metadata, not assumed).
      matrix:
        include:
          - php: "8.2"
            laravel: "^12.0"
            testbench: "^10.0"
          - php: "8.3"
            laravel: "^12.0"
            testbench: "^10.0"
          - php: "8.3"
            laravel: "^13.0"
            testbench: "^11.0"
          - php: "8.4"
            laravel: "^13.0"
            testbench: "^11.0"
    # The audit-log feature is Postgres-specific (pg_advisory_xact_lock,
    # role-level GRANT/REVOKE) and its concurrency test forks real child
    # processes (pcntl) — both need a real Postgres instance and a
    # genuinely separate, restricted "app" role alongside the superuser
    # that owns the schema. See docker-compose.yml for the equivalent
    # local dev setup.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: consent_guard_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: consent_guard_test
      DB_USERNAME: consent_guard_app
      DB_PASSWORD: consent_guard_app_password
      DB_OWNER_USERNAME: postgres
      DB_OWNER_PASSWORD: postgres
    steps:
      - uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          # pcntl/posix: real-process concurrency test (Unix-only, hence
          # this job's ubuntu-latest runner — there is no Windows build).
          # pdo_pgsql/pgsql: the audit log's only supported database.
          extensions: mbstring, dom, fileinfo, sqlite3, pdo_sqlite, pdo_pgsql, pgsql, pcntl, posix
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v6
        with:
          path: vendor
          key: composer-${{ matrix.php }}-${{ matrix.laravel }}-${{ hashFiles('composer.json') }}
          restore-keys: composer-${{ matrix.php }}-${{ matrix.laravel }}-

      - name: Select Laravel/Testbench versions for this matrix cell
        run: |
          composer require --no-interaction --no-update \
            "illuminate/console:${{ matrix.laravel }}" \
            "illuminate/contracts:${{ matrix.laravel }}" \
            "illuminate/database:${{ matrix.laravel }}" \
            "illuminate/http:${{ matrix.laravel }}" \
            "illuminate/routing:${{ matrix.laravel }}" \
            "illuminate/support:${{ matrix.laravel }}"
          composer require --no-interaction --no-update --dev \
            "orchestra/testbench:${{ matrix.testbench }}"

      - name: Install PHP dependencies
        run: composer update --no-interaction --prefer-dist --no-progress

      - name: Provision the restricted app role
        # Simulates what a real host application's infrastructure already
        # provides before installing this package (see
        # docker/postgres/init/01-create-app-role.sql for the local-dev
        # equivalent) — a role distinct from the superuser that owns the
        # schema, which this package's own migration/command then narrow
        # to SELECT/INSERT on the audit log table specifically.
        run: |
          PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -d consent_guard_test -v ON_ERROR_STOP=1 <<'SQL'
          DO $do$
          BEGIN
              IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'consent_guard_app') THEN
                  CREATE ROLE consent_guard_app LOGIN PASSWORD 'consent_guard_app_password';
              END IF;
          END
          $do$;
          GRANT CONNECT ON DATABASE consent_guard_test TO consent_guard_app;
          GRANT USAGE ON SCHEMA public TO consent_guard_app;
          SQL

      - name: Run tests (Pest)
        run: composer test

  dependency-scan:
    name: Dependency vulnerability scan (osv-scanner)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run osv-scanner
        uses: google/osv-scanner-action/osv-scanner-action@v2.6.0
        with:
          scan-args: |-
            --recursive
            ./

  # No CodeQL job: verified on a real run (2026-08-22) that CodeQL's
  # language resolver does not recognise "php" at all — `codeql resolve
  # languages` on CLI 2.26.3 lists cpp/csharp/python/rust/etc. extractors
  # but no PHP one, so `languages: php` fails at the init step before any
  # analysis runs. PHP is not a GitHub-supported CodeQL language; Session
  # 1's inclusion of this job was a wrong assumption, not a config bug.
